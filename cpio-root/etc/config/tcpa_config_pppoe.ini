# ini file for vsat_tcpa
[vsat_ip]
internal_ip1_min = 10.40.0.0        ;internal_ip1_min : internal_ip1_max 小站ip范围1 308 ka goverment
internal_ip1_max = 10.80.0.0
internal_ip2_min = 10.5.0.0         ;internal_ip2_min : internal_ip2_max 小站ip范围2 305 ku civil
internal_ip2_max = 10.11.0.0
internal_ip3_min = 10.177.0.0       ;internal_ip3_min : internal_ip3_max 小站ip范围3 307 Ka goverment
internal_ip3_max = 10.178.0.0
internal_ip4_min = 10.133.0.0       ;internal_ip4_min : internal_ip4_max 小站ip范围2 305 ku civil
internal_ip4_max = 10.136.0.0
tcpa_proxy_ip 	 = 10.3.3.1
httpa_proxy_ip   = 10.3.3.2       	 ;http加速服务器代理ip
aaa_ip           = 10.2.1.41        ;aaa服务器ip
[vsat_tcp_mss]
tcp_mss          = 1400             ;tcp_mss
tp_tcp_mss       = 1400             ;tp_mss
[slow_update_wnd]
tcp_update_len = 700
tp_update_len = 700
[connection_max]
connection_max   = 1000             ;最大连接数
[vsat_network_card]
lan_name         = eth0
wan_name         = sn0         	   ;小站wan口名字
[proxy_port]
tcpa_proxy_port  = 80             	;tcp加速服务器代理端口
httpa_proxy_port = 8081			    ;http加速服务器代理端口
[wnd_scale]
tcp_wnd_scale	  = 1			     ;tcp扩展窗口开关（0：关闭，1：开启）
[tcp_wnd]
tcp_recv_wnd_init   = 40960	
tcp_ws_wnd_max		= 819200
[tp_tcp_wnd]
tp_recv_wnd_init    = 40960
tp_ws_wnd_max		= 10240000
[tcp_all_conn_contr]
tcp_all_wnd				= 40960000		;控制TCP侧发送速率的几个参数
tcp_all_cfifo2pcb_len 	= 10000
tcp_all_snd_queuelen 	= 10000
tcp_all_lpbuf_len 		= 10000
[tp_all_conn_contr]
tp_all_wnd 				= 40960000		;控制TP侧发送速率的几个参数
tp_all_cfifo2pcb_len 	= 10000
tp_all_snd_queuelen 	= 2000
tp_all_lpbuf_len 		= 10000
[congestion_control_algorithm]
tp_congestion_control = cubic	      ;tp拥塞控制算法（reno, bic, cubic, bbr）
[sc_mode]
single_copy_mode = 1			         ;单拷贝模式（0：关闭，1：开启）
[tcp_buf]
tcp_snd_queue_init = 500		;100	
tcp_snd_buf_init   = 1000000		;51200
[tp_buf]
tp_tcp_snd_queue_init = 1000
tp_tcp_snd_buf_init   = 8400000			   ;600*1400（num*mss）
[l2_mode]
tcpacc_gateway_l2         = 1
[mesh_mode]
mesh_switch         = 1
[tp_cwnd]
tp_cwnd_ssthresh = 1300000				;RENO_IM会用到
tp_cwnd_init = 100					;CUBIC算法用到，单位是mss的倍数,默认100,终端的初始接收窗口为819200，12s前向可以达到10MBps
tp_ssthresh_init = 500					;CUBIC算法用到，单位是mss的倍数, 默认500
[timestamps]
tcp_timestamps_switch = 0
[tx_checksum_mode]
tx_chksum = 0							;tcp侧网卡是否计算tcp校验和
tp_tx_chksum = 0						;tp侧网卡是否计算tcp校验和
[tcp_recv_num_ack]
tcp_mesh_recv_num_ack = 2
tcp_slow_recv_num_ack = 200
[tp_recv_num_ack]
tp_mesh_recv_num_ack = 4					;mesh模式收到（tp_mesh_recv_num_ack）数据包回一个ack
tp_proxy_recv_num_ack = 2					;proxy模式收到（tp_mesh_recv_num_ack）数据包回一个ack
tp_slow_recv_num_ack = 500
[tp_gro]
tp_gro_enable = 0
tp_buf_tot_len = 7800
tp_loop_cnt_num = 20
[cubic_rtt_interval]
tp_rtt_interval_us = 200000
[bbr_rtt]
tp_bbr_min_rtt_win_sec = 36000
tp_rtt_first_test = 1
[encap]
encap_flag = 1
[keepalive]
tcp_keepidle = 1200000
tcp_keepcnt = 6
tcp_keepintvl = 10000
tp_keepidle = 1200000
tp_keepcnt = 6
tp_keepintvl = 10000
[retry_max]
retry_max_num = 100