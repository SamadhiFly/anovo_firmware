	<head>
		<title class="installsettitle"></title>
		<meta http-equiv="X-UA-Compatible" content="edge" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="renderer" content="webkit">
		<meta http-equiv="pragma" content="no-cache">
		<meta http-equiv="cache-control" content="no-cache">
		<meta http-equiv="expires" content="0">
		<meta name="viewport" content="width=1024px">
		<link href="/css/bc.css" rel="stylesheet">
		<link href="/css/sysload.css" rel="stylesheet">
	</head>
	<script>
		document.write("<script type='text/javascript' src='/script/jquery-1.8.3.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/script/jquery.dialog.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/script/rcst-type.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/i18n/terminal-trans.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/script/language-config.js?time=" + Math.random() + " '></" + "script" + ">");
	</script>

	<body onunload="playerPause()">
		<div id="doc" style="min-width:1200px">
			<div id="hd">
				<div class="inner">
					<div class="mod-head clearfix">
						<span id="header"></span>
						<script src="/script/header.js"></script>
					</div>
					<div class="mod-set-nav">
						<ul class="clearfix">
							<li id="sysinfo"><a href="/root/terminal/sysload.htm"
									+"?timestamp="+new Date().getTime() id=" sysinfo_a"><i class="ico ico-1"></i><span
										id="systemstatus"></span></a></li>
							<li id="starinfo"><a href="/root/terminal/starPoint.htm"
									+"?timestamp="+new Date().getTime()  id=" starPoint_a"><i
										class="ico ico-1"></i><span id="starPoint"></span></a></li>
							<li id="rxinfo"><a href="/root/terminal/rxsnr.htm" +"?timestamp="+new Date().getTime() id="
									rxinfo_a"><i class="ico ico-2"></i><span id="receivestatus"></span></a></li>
							<li id="txinfo"><a href="/root/terminal/txsnr.htm" +"?timestamp="+new Date().getTime() id="
									txinfo_a"><i class="ico ico-3"></i><span id="transmitstatus"></span></a></li>
							<li id="chipinfo"><a href="/root/terminal/chippower.htm"
									+"?timestamp="+new Date().getTime() id=" chipinfo_a"><i class="ico ico-4"></i><span
										id="hardwarestatus"></span></a></li>
						</ul>
					</div>
				</div>
			</div>
			<script src="/root/terminal/starinfo-active.js"></script>
			<div id="bd">
				<div class="mod-rtcore-data">
					<div class="mod-set">
						<div class="hd">
							<h3><span class="StarPointing"></span></h3>
						</div>
						<div class="setting">
							<table>
								<tr>
									<td style="width:280px">
										<div class="form-item">
											<span class="LockedStatus"></span>
										</div>
									</td>
									<td style="width:160px;text-align:center">
										<div class="form-item">
											<span class="CurrentSNR"></span>
										</div>
									</td>
									<td style="width:160px;text-align:center;">
										<div class="form-item">
											<span class="MaxSNR"></span>
										</div>
									</td>
								</tr>
								<tr>
									<td style="width:280px;">
										<div class="form-item">
											<span id="locked">--</span>
										</div>
									</td>
									<td style="width:160px;text-align:center">
										<div class="form-item">
											<span class="num1" id="now_snr">--</span>
										</div>
									</td>
									<td style="width:160px;text-align:center">
										<div class="form-item">
											<span class="num" id="max_snr">--</span>
										</div>
									</td>
								</tr>
							</table>
						</div>
					</div>
					<div id="container" style="width: 100%; height: 450px; margin: 0 auto"></div>
					<div style="text-align:right"><small id="scale">-</small></div>
					<audio id="player" class="player" controls="controls" style="display:none"></audio>
					<audio id="player_max" class="player" controls="controls" style="display:none">
						<source src="/audio/max_snr2.wav"></audio>
				</div>
				<span id="footer"></span>
				<script src="/script/footer.js"></script>
			</div>
		</div>
	</body>
	<script>
		document.write("<script type='text/javascript' src='/script/highcharts.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/script/language-config.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/root/terminal/starPoint.js?time=" + Math.random() + " '></" + "script" + ">");
	</script>

</html>
