<head>
<title id="installsettitle"></title>
<meta http-equiv="X-UA-Compatible" content="edge" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="renderer" content="webkit">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta name="viewport" content="width=1024px">
<link href="/css/bc.css" rel="stylesheet">
<link href="/css/install-star.css" rel="stylesheet">
</head>
<script >
document.write("<script type='text/javascript' src='/script/jquery-1.8.3.js?time="+Math.random()+" '></"+"script"+">");
document.write("<script type='text/javascript' src='/script/jquery.dialog.js?time="+Math.random()+" '></"+"script"+">");
document.write("<script type='text/javascript' src='/script/highcharts.js?time="+Math.random()+" '></"+"script"+">");
document.write("<script type='text/javascript' src='/script/rcst-type.js?time="+Math.random()+" '></"+"script"+">");
document.write("<script type='text/javascript' src='/i18n/install-trans.js?time="+Math.random()+" '></"+"script"+">");
document.write("<script type='text/javascript' src='/script/language-config.js?time="+Math.random()+" '></"+"script"+">");
</script>
<body onunload="playerPause()">
<div id="doc" style="min-width:1200px">
	<div id="hd">
		<div class="inner">
			<div class="mod-head">
			   	<h1 id="logo"><a href="/root/home.htm"><span id="logoo"></span></a></h1>
				<div id="userbar">
					<a href="/root/home.htm" id="administrator"></a>
						<span class="line">|</span>
					<!-- <a style="cursor:pointer" onclick="langset()" id="lang" value="en"></a> -->
					<select  name="language_three"  id="language_three"style="cursor:pointer" onChange="langset()">
						<option value="en">English</option>
						<option value="zh">简体中文</option>
						<option value="zh_HK">繁體中文</option>
				   </select>
				</div>		   	
			</div>
		</div>
	</div>
	<div id="bd">
		<div class="mod-rtstatus" id="netstatus">
			<div class="inner">
				<div class="terminal">
					<img src="/icons/2.png" />
				</div>
				<table class="rcst">
					<tr>
						<td  style="width:360px">
							<span class="EnterInstallationParameters"></span>
						</td>
						<td style="width:280px">
							&nbsp;&emsp;<span class="StarPointing"></span>
						</td>
						<td style="width:350px">
							&nbsp;&nbsp;&emsp;&emsp;<span class="Netting"></span>
						</td>
					</tr>
				</table>			
			</div>  
		</div>
	</div>
	<div class="mod-rtcore-data">
		<div class="mod-set">
			<div class="hd">
				<h3><span class="StarPointing"></span></h3>
			</div>
			<div class="setting">
				<table>
					<tr>
						<td style="width:280px">
							<div class="form-item">
								<span  class="LockedStatus" ></span>
							</div>
						</td>
						<td style="width:160px;text-align:center">
							<div class="form-item">
								<span class="CurrentSNR" ></span>
							</div>
						</td>
						<td style="width:160px;text-align:center;">
							<div class="form-item">
								<span class="MaxSNR" ></span>
							</div>
						</td>
					</tr>
					<tr>
						<td style="width:280px;">
							<div class="form-item">
								<span id="locked">--</span>
							</div>
						</td>
						<td style="width:160px;text-align:center">
							<div class="form-item">
								<span class="num1" id="snr">--</span>	
							</div>
						</td>
						<td style="width:160px;text-align:center">
							<div class="form-item">
								<span class="num2" id="max_snr">--</span>
							</div>
						</td>
					</tr>
				</table>
			</div>			
		</div>
		<div id="container" style="width: 100%; height: 350px; margin: 0 auto; border: 1px solid "></div>
		<div style="text-align:right"><small id="scale">-</small></div>
		<br />
		<table style="width:500px;margin:0px 0px 80px 200px">
			<tr style="heigh:100px"></tr>
			<tr>
				<td style="width:265px">
					<div class="form-item">
						<button type="submit" onclick="back()" class="btn_sub1" ><span class="Back"></span></button>
					</div>
				</td>
				<td>
					<div class="form-item">
						<button type="submit" onclick="next()" class="btn_sub" ><span class="Next"></span></button>
					</div>
				</td>
			</tr>
		</table>
		<audio id="player" class="player" controls="controls"  style="display:none"></audio>
		<audio id="player_max" class="player" controls="controls"  style="display:none"><source src="/audio/max_snr2.wav"></audio>		
	<span id="footer"></span>
	<script src="/script/footer.js"></script>								
	</div>		
</div>	
</body>
<script>
document.write("<script type='text/javascript' src='/root/guide/install-star.js?time="+Math.random()+" '></"+"script"+">");
</script>
</html>
