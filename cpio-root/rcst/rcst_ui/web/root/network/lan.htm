			<div id="bd">

					<div class="bdd">
						<table class="table" style="width:800px">
							<thead>
								<tr>
									<th class="form-item" style="width:80px; height:20px"><span

											class="NetworkMode"></span></th>

										id="lan_btn_sub"><span class="Submit"></span></button>
								</td>
							</tr>
						</table>

						<h3 class="WAN">WAN</h3>
