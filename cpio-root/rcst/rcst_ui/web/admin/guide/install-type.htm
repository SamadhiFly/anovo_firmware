<head>
<title id="installtitle"></title>
<meta http-equiv="X-UA-Compatible" content="edge" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="renderer" content="webkit">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta name="viewport" content="width=1024px">
<link href="/css/bc.css" rel="stylesheet">
<link href="/css/install-type.css" rel="stylesheet">
</head>
<script>
document.write("<script type='text/javascript' src='/script/jquery-1.8.3.js?time="+Math.random()+" '></"+"script"+">");
document.write("<script type='text/javascript' src='/script/jquery.dialog.js?time="+Math.random()+" '></"+"script"+">");
document.write("<script type='text/javascript' src='/script/rcst-type.js?time="+Math.random()+" '></"+"script"+">");
document.write("<script type='text/javascript' src='/i18n/install-trans.js?time="+Math.random()+" '></"+"script"+">");
document.write("<script type='text/javascript' src='/script/language-config.js?time="+Math.random()+" '></"+"script"+">");
</script>
<body>
<div id="doc" style="min-width:1200px">
	<div id="hd">
		<div class="inner">
			<div class="mod-head">
			   	<h1 id="logo"><span id="logoo"></span></h1>
					<div id="userbar">
<!--
						<a href="/admin/home.htm" id="administrator">Home</a>
							<span class="line">|</span>
-->
						<!-- <a style="cursor:pointer" onclick="langset()" id="lang" value="en"></a> -->
						<select  name="language_three"  id="language_three"style="cursor:pointer" onChange="langset()">
							<option value="en">English</option>
							<option value="zh">简体中文</option>
							<option value="zh_HK">繁體中文</option>
					   </select>
					</div>		   	
			</div>
		</div>
	</div>
	<div id="bd">
		<div class="mod-rtstatus">
			<div class="inner">
              		<div class="terminal">
                  		<img src="/icons/update.png" />
						<div class="rcst"><span class="Pleasechoosetheinstallationmethod" ></span></div>
              		</div>
			</div>    
		</div>
	</div>
	<div class="mod-rtcore-data">
		<div class="mod-set">
			<div class="hd">
				<h3><span class="InstallationMethod" ></span></h3>
			</div>
			<br/>
			<div class="bd">
				<table style="width:900px">
					<tr>
						<td style="width:265px">
							<div class="form-item">
								<span><span class="InstallationMethod" ></span></span>
							</div>
						</td>
						<td>
							<div class="form-item">
								<select id="installType" style="width:190px;height:29px;" onChange="installTypeChange()">
<!--
									<option class="installType" value=1></option>
-->
									<option class="installType" value=0></option>
								</select>	
							</div> 
						</td>
                    </tr>
				</table>
				<div id="custominstall" style="display:none">
					<table style="width:900px">
						<tr style="height:50px"></tr>
						<tr>
							<td  style="width:265px"></td>
							<td>
								<div class="form-item">
									<button type="submit" onclick="next()" class="btn_sub" ><span class="Next"></span></button>
								</div>
							</td>
						</tr>
					</table>
				</div>
				<div id="importinstall" style="display:none">						
	                <form class="form" name="uploadForm" id="uploadForm" method="post" enctype="multipart/form-data" >
						<table style="width:900px">
							<tr>
								<td style="width:265px">
									<div class="form-item">
										<span class="UploadConfigurationFiles"></span>
									</div>
								</td>
								<td>
									<div class="item">
										<span class="v"><input type="file" name="image" id="image" /></span>
										<em class="t"></em>
									</div>
								</td>
							</tr>
						</table>
						<table style="width:900px">
							<tr>
								<td style="width:265px"></td>
								 <td>
									<div class="form-item">
										<button type="button" class="btn_sub" id="uploadFormBt"><span class="Upload"></span></button>
									</div>
								</td>
							</tr>
						 </table>
					</form>	
                </div>
			</div>
		</div>
		<span id="footer"></span>
		<script src="/script/footer.js"></script>		
	</div>
</div>
</body>
<script>
document.write("<script type='text/javascript' src='/admin/guide/install-type.js?time="+Math.random()+" '></"+"script"+">");
</script>
</html>
