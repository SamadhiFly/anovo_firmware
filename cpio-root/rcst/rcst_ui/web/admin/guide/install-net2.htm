	<head>
		<title id="installsettitle"></title>
		<meta http-equiv="X-UA-Compatible" content="edge" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="renderer" content="webkit">
		<meta http-equiv="pragma" content="no-cache">
		<meta http-equiv="cache-control" content="no-cache">
		<meta http-equiv="expires" content="0">
		<meta name="viewport" content="width=1024px">
		<link href="/css/bc.css" rel="stylesheet">
		<link href="/css/install-set.css" rel="stylesheet">
	</head>
	<script>
		document.write("<script type='text/javascript' src='/script/qwrap.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/script/jquery-1.8.3.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/script/jquery.dialog.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/script/highcharts.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/script/rcst-type.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/i18n/install-trans.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/script/language-config.js?time=" + Math.random() + " '></" + "script" + ">");
	</script>

	<body>
		<div id="doc" style="min-width:1100px">
			<div id="hd">
				<div class="inner">
					<div class="mod-head">
						<h1 id="logo"><span id="logoo"></span></h1>
						<div id="userbar">
							<!--
					<a href="/admin/home.htm" id="administrator">主界面</a>
						<span class="line">|</span>
-->
							<!-- <a style="cursor:pointer" onclick="langset()" id="lang" value="en"></a> -->
							<select name="language_three" id="language_three" style="cursor:pointer"
								onChange="langset()">
								<option value="en">English</option>
								<option value="zh">简体中文</option>
								<option value="zh_HK">繁體中文</option>
							</select>
						</div>
					</div>
				</div>
			</div>
			<div id="bd">
				<div class="mod-rtstatus" id="netstatus">
					<div class="inner">
						<div class="terminal">
							<img src="/icons/3.png" />
						</div>
						<table class="rcst">
							<tr>
								<td style="width:360px">
									<span class="EnterInstallationParameters"></span>
								</td>
								<td style="width:280px">
									&nbsp;&emsp;<span class="StarPointing"></span>
								</td>
								<td style="width:350px">
									&nbsp;&nbsp;&emsp;&emsp;<span class="Netting"></span>
								</td>
							</tr>
						</table>
					</div>
				</div>
			</div>
			<div class="mod-rtcore-data-sat">
				<div class="mod-set">

					<div class="hd">
						<h3 class="ManagerPort"></h3>
					</div>
					<div class="bd">
						<table style="width:900px">
							<tr>
								<td style="width:250px;height:40px">
									<div class="form-item">
										<span class="ManagerIP"></span>
									</div>
								</td>
								<td>
									<div class="form-item">
										<span id="managerIP"></span>
									</div>
								</td>
							</tr>
							<tr>
								<td style="width:250px;height:40px">
									<div class="form-item">
										<span class="ManagerNetmask"></span>
									</div>
								</td>
								<td>
									<div class="form-item">
										<span id="managerNetmask"></span>
									</div>
								</td>
							</tr>
							<tr>
								<td style="width:250px;height:40px">
									<div class="form-item">
										<span class="MAC">MAC</span>
									</div>
								</td>
								<td>
									<div class="form-item">
										<span id="rcstMac"></span>
									</div>
								</td>
							</tr>
						</table>
						</br>
						</br>
					</div>

					<div class="hd">
						<h3 class="ServicePort"></h3>
					</div>
					</br>
					</br>
					<div id="bdss">
						<table class="table" style="width:900px">
							<thead>
								<tr>
									<th class="form-item" style="width:80px; height:20px"><span
											class="Interface">网口</span></th>
									<th class="form-item" style="width:80px; height:20px"><span
											class="NetworkMode"></span></th>
									<th class="form-item" style="width:80px; height:20px"><span
											class="NetworkTag"></span></th>
									<th class="form-item" style="width:80px; height:20px"><span>VLAN ID</span></th>
									<th class="form-item" style="width:130px; height:20px"><span>WAN IP</span></th>
									<th class="form-item" style="width:130px; height:20px"><span
											class="WANNetmaks">WANNetmaks</span></th>
									<th class="form-item" style="width:130px; height:20px"><span>LAN IP</span></th>
									<th class="form-item" style="width:130px; height:20px"><span
											class="LANNetmaks"></span></th>
									<th class="form-item" style="width:130px; height:20px"><span
											class="DHCPStartIP"></span></th>
									<th class="form-item" style="width:130px; height:20px"><span
											class="DHCPEndIP"></span></th>
								</tr>
							</thead>
							<tbody id="networkinfo_list">
							</tbody>
						</table>
					</div>

					<table style="width:900px">
						<tr>
							<td style="height:50px"></td>
						</tr>
						<tr>
							<td style="width:500px">
							</td>
							<td style="width:500px">
								<div class="form-item">
									<button type="submit" onclick="back()" class="btn_sub1"><span
											class="Back"></span></button>
								</div>
							</td>
							<td>
								<div class="form-item">
									<button type="submit" onclick="next()" class="btn_sub"><span
											class="Next"></span></button>
								</div>
							</td>
						</tr>
					</table>

					<span id="footer"></span>
					<script src="/script/footer.js"></script>
				</div>
			</div>
	</body>
	<script type="tmpl/html" id="show_tr">
<tr style="height:30px">
	<td class="form-item" style="height:20px;">&nbsp;{$network_interface}</td>
	<td class="form-item" style="height:20px;">&nbsp;{$network_type}</td>
	<td  class="form-item" style="height:20px">&nbsp;{$tag}</td>
	<td  class="form-item" style="height:20px">&nbsp;{$vid}</td>
	<td  class="form-item" style="height:20px">&nbsp;{$wanvrfip}</td>
	<td  class="form-item" style="height:20px">&nbsp;{$wanvrfnetmask}</td>
	<td  class="form-item" style="height:20px">&nbsp;{$lanvrfip}</td> 
	<td  class="form-item" style="height:20px">&nbsp;{$lanvrfnetmask}</td>	
	<td  class="form-item" style="height:20px">&nbsp;{$dhcp_start_ip}</td>
	<td  class="form-item" style="height:20px">&nbsp;{$dhcp_end_ip}</td>
   </tr>
</script>
	<script>
		document.write("<script type='text/javascript' src='/root/network/lan-get.js?time=" + Math.random() + " '></" + "script" + ">");
		document.write("<script type='text/javascript' src='/admin/guide/install-net2.js?time=" + Math.random() + " '></" + "script" + ">");
	</script>

</html>
