charon {
  load = sha1 sha2 md5 aes des hmac pem pkcs1 x509 revocation constraints curve25519 pubkey gmp random nonce curl kernel-netlink socket-default updown stroke vici
	filelog {
        	/tmp/strongswan_log {
        	time_format = %b %e %T
        	append = no
        	default = 1
        	flush_line = yes
        	}
	}

}

