[loop_mode]
## function_loop choice [main_loop:0, tcpacc_loop:1, pfring_loop:2]
tcpacc_loop_flag = 2

[dpdk]
## Hexadecimal bitmask of cores to run on.
lcore_mask=3
## Port mask, enable and disable ports.
## Default: all ports are enabled.
#port_mask=1
channel=4
## Number of ports.
#nb_ports=2
promiscuous=1
numa_on=0
## TCP segment offload, default: disabled.
tso=0
## HW vlan strip, default: enabled.
vlan_strip=0
effective_conn = 750000
##modified by mengxy
port_list=0-1


## Re-enqueue unsent packets
requeue=0
## Treat small packets  according to the weight of its length
dequeue_weight=1
## Returns EAGAIN if fails to send to protocol stack
output_watermark=0
## Returns ENOBUFS if fails to enqueue to send ring
enqueue_watermark=0

## Port config section
## According to dpdk.nb_ports: port0, port1...
[port0]
name=em1
addr=1.1.1.1
netmask=255.255.255.0
broadcast=1.1.1.255
gateway=1.1.1.1
#pcap=./port0.pcap
#cc_algorithm=cdg
tcp_Xdelay_ack_enable=0
[port1]
name=sn0
addr=2.2.2.2
netmask=255.255.255.0
broadcast=2.2.2.255
gateway=2.2.2.2
## Packet capture path, this will hurt performance
#pcap=./port1.pcap
tcp_Xdelay_ack_enable=0

#cc_algorithm=vegas

## Kni config: if enabled and method=reject,
## all packets that do not belong to the following tcp_port and udp_port
## will transmit to kernel; if method=accept, all packets that belong to
## the following tcp_port and udp_port will transmit to kernel.
#[kni]
#enable=1
#method=reject
#tcp_port=80,443
#udp_port=53

## FreeBSD network performance tuning configurations.
## Most native FreeBSD configurations are supported.
[freebsd.boot]
hz=100

## Block out a range of descriptors to avoid overlap
## with the kernel's descriptor space.
## You can increase this value according to your app.
fd_reserve=1024
freebsd_l2=1
transmod=0
lromod=1

kern.ipc.maxsockets=924288
#kern.ipc.maxmbufmem=536870912
#kern.ipc.nmbclusters=16384|32768|65536
#kern.ipc.nmbclusters=65536

#net.inet.tcp.syncache.hashsize=4096
net.inet.tcp.syncache.hashsize=16384
net.inet.tcp.syncache.bucketlimit=100

#net.inet.tcp.tcbhashsize=65536
net.inet.tcp.tcbhashsize=524288

[freebsd.sysctl]
##timer_set
#tcp_pers_max=30
#tcp_keep_idle=120
#tcp_rexmt_max=32

tcp_hystart_enable=0

kern.ipc.somaxconn=32768
kern.ipc.maxsockbuf=16777216

net.inet.tcp.fast_finwait2_recycle=1

net.inet.tcp.sendbuf_auto=1
#net.inet.tcp.sendbuf_auto=0
net.inet.tcp.sendspace=65536
net.inet.tcp.sendbuf_inc=8192
net.inet.tcp.sendbuf_max=3145728

net.inet.tcp.recvbuf_auto=1
#net.inet.tcp.recvspace=8388608
net.inet.tcp.recvspace=16384
net.inet.tcp.recvbuf_inc=4096
net.inet.tcp.recvbuf_max=1572864

net.inet.tcp.nolocaltimewait=1

#net.inet.tcp.cc.algorithm=htcp
net.inet.tcp.cc.algorithm=cubic

net.inet.tcp.inflight.enable=0
#net.inet.tcp.inflight.enable=1

#modified by mengxy to enable sack control
#net.inet.tcp.sack=1
net.inet.tcp.sack.enable=1
net.inet.tcp.blackhole=1
net.inet.tcp.msl=2000
net.inet.tcp.delayed_ack=1
net.inet.tcp.rfc1323=1

net.inet.tcp.fastopen.server_enable=1
net.inet.tcp.fastopen.client_enable=1
net.inet.tcp.fastopen.acceptany=1
net.inet.ip.portrange.first=1000
net.inet.ip.portrange.last=65535

#modprobe nf_conntrack_ipv4
#net.nf_conntrack_max=6553600


net.inet.udp.blackhole=1
net.inet.ip.redirect=0
net.inet.tcp.path_mtu_discovery=1
net.inet.ip.forwarding=0
