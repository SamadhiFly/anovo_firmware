# ini file for vsat_tcpa
[transec_conf]
tp_ws_wnd_max_transec = 3072000
tcp_all_wnd_transec = 3174400
[vsat_ip]
internal_ip2_min = 10.5.0.0         ;internal_ip2_min : internal_ip2_max 小站ip范围2 305 ku civil
internal_ip2_max = 10.11.0.0
internal_ip3_min = 10.177.0.0       ;internal_ip3_min : internal_ip3_max 小站ip范围3 307 Ka goverment
internal_ip3_max = 10.178.0.0
internal_ip4_min = 10.133.0.0       ;internal_ip4_min : internal_ip4_max 小站ip范围2 305 ku civil
internal_ip4_max = 10.136.0.0
tcpa_proxy_ip 	 = 10.3.3.1
httpa_proxy_ip   = 10.3.3.2       	 ;http加速服务器代理ip
aaa_ip           = 10.2.1.41        ;aaa服务器ip
[vsat_tcp_mss]
tcp_mss          = 1200             ;tcp_mss
tp_tcp_mss       = 1200             ;tp_mss
[slow_update_wnd]
tcp_update_len = 700
tp_update_len = 700
[cycle_max]
cycle_max_num   = 150
[connection_max]
connection_max   = 2000             ;最大连接数
[vsat_network_card]
lan_name         = em3			;no use
wan_name         = em2         		;no use
[proxy_port]
tcpa_proxy_port  = 80             	;tcp加速服务器代理端口
httpa_proxy_port = 8081			    ;http加速服务器代理端口
[wnd_scale]
tcp_wnd_scale	  = 1			     ;tcp扩展窗口开关（0：关闭，1：开启）
[tcp_wnd]
tcp_recv_wnd_init   = 40960
tcp_ws_wnd_max		= 819200
[tp_tcp_wnd]
tp_recv_wnd_init    = 512000
tp_ws_wnd_max		= 10240000	;5120000
[tcp_all_conn_contr]
tcp_all_wnd				= 12288000	;6144000		;控制TCP侧发送速率的几个参数
tcp_all_cfifo2pcb_len 	= 4100
tcp_all_snd_queuelen 	= 4100
tcp_all_lpbuf_len 		= 4100
[tp_all_conn_contr]
tp_all_wnd 				= 6144000		;控制TP侧发送速率的几个参数
tp_all_cfifo2pcb_len 	= 2100
tp_all_snd_queuelen 	= 5000
tp_all_lpbuf_len 		= 2100
tp_all_unsent_len 		= 4000
[pbuf_ssthresh]
pbuf_rem_ssthresh	= 2000
tp_pbuf_rem_ssthresh	= 5000
[congestion_control_algorithm]
tcp_congestion_control = reno
tp_congestion_control = cubic	      ;tp拥塞控制算法（reno, bic, cubic, bbr, reno_im）
[sc_mode]
single_copy_mode = 1			         ;单拷贝模式（0：关闭，1：开启）
[fastopen]
tp_fastopen_on = 0
tcp_recv_get_delay_time = 50			;ms
[tcp_buf]
tcp_snd_queue_init = 200		;100	
tcp_snd_buf_init   = 1000000		;51200
[tp_buf]
tp_tcp_snd_queue_init = 5000
tp_tcp_snd_buf_init   = 8600000			   ;600*1400（num*mss）
tp_tcp_snd_default_queue_init = 7000
tp_all_snd_default_queuelen = 10000
[trans_mode]
tcpacc_trans_mode	= 1					;0:TRANS_MODE;1:NON_TRANS_MODE
[5g_switch]
m5g_switch		= 1					;0:off;1:on
[l2_mode]
tcpacc_gateway_l2         = 1					;no use
[mesh_mode]
mesh_switch         = 1						;no use
[tcp_cwnd]
tcp_cwnd_ssthresh = 1300000				;RENO_IM算法用到
tcp_cwnd_init	= 20			;2
tcp_ssthresh_init	= 200
tcp_rto_cwnd_init = 5
[tp_cwnd]
tp_cwnd_ssthresh = 9000000				;RENO_IM会用到
tp_cwnd_init = 500						;CUBIC算法用到，单位是mss的倍数,默认100,终端的初始接收窗口为819200，12s前向可以达到10MBps
tp_ssthresh_init = 1000					;CUBIC算法用到，单位是mss的倍数, 默认500
tp_rto_cwnd_init = 5
[timestamps]
tcp_timestamps_switch = 0
[tx_checksum_mode]
tx_chksum = 0							;tcp侧网卡是否计算tcp校验和
tp_tx_chksum = 0						;tp侧网卡是否计算tcp校验和
[tcp_recv_num_ack]
tcp_mesh_recv_num_ack = 4
tcp_winupdate_recv_num_ack = 3
[tp_recv_num_ack]
tp_mesh_recv_num_ack = 4					;mesh模式收到（tp_mesh_recv_num_ack）数据包回一个ack
tp_proxy_recv_num_ack = 2					;proxy模式收到（tp_mesh_recv_num_ack）数据包回一个ack
tp_winupdate_recv_num_ack = 3
[active_winupdate_time]
tcp_active_winupdate_time = 10		;主动更新窗口时间, 单位:s
tp_active_winupdate_time = 10		;主动更新窗口时间, 单位:s
[tcp_maxrtx]
tcp_syn_maxrtx		= 6
tcp_data_maxrtx		= 8
[tp_maxrtx]
tp_syn_maxrtx		= 8
tp_data_maxrtx		= 8
[tcp_gro]
tcp_gro_enable = 0
tcp_gro_max_len = 1200
tp_gso_enable = 0
tp_trim_enable = 0
tcp_gro_min_len = 10
[tp_gro]
tp_gro_enable = 1						;gro:0,gso:0,tx:0 无优化; gro:0,gso:1,tx:1 不组包，网卡计算校验和;
tp_gro_max_len = 3600						;gro:1,gso:0,tx:0 应用层组包并拆包，网卡不计算校验和; gro:1,gso:1,tx:1 应用层组包，内核拆包,网卡计算校验和;
gso_enable = 0
tcp_trim_enable = 1
tp_gro_min_len = 10
[tp_out_control]
tp_rack_retrans = 0
[cubic_rtt_interval]
tp_rtt_interval_us = 200000
[bbr_rtt]
tp_bbr_min_rtt_win_sec = 36000
tp_rtt_first_test = 1
[encap]
encap_flag = 1
[keepalive]
tcp_keepidle = 60000
tcp_keepcnt = 6
tcp_keepintvl = 5000
tp_keepidle = 60000
tp_keepcnt = 6
tp_keepintvl = 5000
[eff_conn_ssthresh]
eff_send_ssthresh=2000
eff_recv_ssthresh=2000
[tp_new_snd_queuelen]
tp_new_snd_queuelen_policy = 1
tp_snd_queuelen_min = 50
tp_eff_send_data_rtt_ten_multiple = 30
long_delay_fast_snd_queuelen_inc = 500
long_delay_slow_snd_queuelen_inc = 50
short_delay_snd_queuelen_inc = 15
pc_delay_minrtt_ten_multiple = 15
pc_rtttime_min_default = 5000
vsat_delay_minrtt_ten_multiple = 15
vsat_delay_jitter_lower_limit = 6000		;us
vsat_delay_jitter_upper_limit = 300000		;us
vsat_rtttime_min_default = 100000		;us
vsat_delay_jitter_p2p_lower_limit = 900000	;us
satellite_delay_p2p_default = 1000000		;us
[tp_rcv_wnd_adjust]
tp_rcv_wnd_new_policy = 1
satellite_delay_lower_limit = 500000
no_satellite_delay_lower_limit = 6000
no_satellite_delay_upper_limit = 500000
pc_delay_upper_limit = 6000
tp_eff_recv_data_rtt_ten_multiple = 20
tp_recv_space_two_multiple = 3
satellite_delay_default = 600000
no_satellite_delay_default = 100000
pc_delay_default = 5000
[reass_frag_func]
reass_max_pbufs = 1000
aif_frag_mtu = 1500
bif_frag_mtu = 1500
reass_maxage = 3			;s
[delayack_time]
tp_delayack_time = 10		;ms
[retry_max]
retry_max_num = 10
